# ============================================================
# Instagram Post Generation (photo-first)
# ============================================================
# Mon / Wed / Fri at ~8am Mountain Time
# Picks one of the owner's photos, writes an Instagram caption
# about it, and sends it to the owners' Telegram group for Post/Skip
# ============================================================

name: Generate Instagram Post

on:
  schedule:
    # ~8am Mountain Time = 3pm UTC (winter), Mon/Wed/Fri
    - cron: '13 15 * * 1,3,5'
  workflow_dispatch: # Allow manual triggers

jobs:
  generate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: marketing

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Generate Instagram draft
        run: npm run generate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
